name: cp2-metabase
services:
  database:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    platform: linux/arm64
    restart: unless-stopped
    env_file: .runtime/postgres.env
    volumes:
      - settings:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U metabase -d metabase']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  metabase:
    image: metabase/metabase:v0.65.2@sha256:b62ac14872e9992d28218a2264d99484e0707064aae9fb594d8fbb3bc1518a9e
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .runtime/metabase.env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: database
      MB_DB_PORT: '5432'
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: '3000'
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      MB_JAVA_TIMEZONE: Asia/Kuala_Lumpur
      JAVA_OPTS: '-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ActiveProcessorCount=2'
    # Keep initial setup private. No database or Metabase port is exposed publicly.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - plugins:/plugins
    mem_limit: 5g
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  settings:
  plugins:
