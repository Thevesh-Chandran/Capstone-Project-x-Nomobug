steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.collector
      - -t
      - asia-southeast1-docker.pkg.dev/profound-keel-500007-s4/cp2-reporting/collector:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - asia-southeast1-docker.pkg.dev/profound-keel-500007-s4/cp2-reporting/collector:$BUILD_ID
      - -c
      - 'from scripts import cp2_cloud_collector; from scripts.calendar_appointment_policy import load_policy; load_policy(); print("collector import and appointment policy smoke passed")'
images:
  - asia-southeast1-docker.pkg.dev/profound-keel-500007-s4/cp2-reporting/collector:$BUILD_ID
serviceAccount: projects/profound-keel-500007-s4/serviceAccounts/cp2-reporting-deployer@profound-keel-500007-s4.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
