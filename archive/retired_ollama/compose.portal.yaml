services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${CP2_PORTAL_PORT:-8089}:8080"
    environment:
      CP2_PORTAL_TOKEN: ${CP2_PORTAL_TOKEN:?Set a staff access code of at least 24 characters}
      CP2_ALLOWED_HOSTS: localhost,127.0.0.1
      CP2_OLLAMA_URL: http://ollama:11434
      CP2_OLLAMA_MODEL: ${CP2_OLLAMA_MODEL:-llama3.2:3b}
      CP2_DATA_MODE: snapshot
    volumes:
      - ./outputs/portal:/var/lib/cp2-portal:ro
    depends_on:
      - ollama
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    mem_limit: 6g
    # No published inference port. Only the portal can reach Ollama.
volumes:
  ollama_models:
