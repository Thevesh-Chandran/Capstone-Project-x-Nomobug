version: 2

models:
  - name: warranty_risk_3session_dataset
    description: "Mature, leakage-safe experiment cohort restricted to warranty-eligible residential 3x packages. The target is a recorded Calendar warranty signal within 30 days after a unique 3/3 anchor, not proven pest recurrence."
    columns:
      - name: sales_record_id
        data_tests: [not_null, unique]
      - name: prediction_anchor_date
        data_tests: [not_null]
      - name: warranty_signal_within_30d
        data_tests: [not_null]
      - name: evaluation_split
        data_tests:
          - accepted_values:
              arguments:
                values: [train_2024_2025, holdout_2026]
      - name: target_definition
        data_tests:
          - accepted_values:
              arguments:
                values: [eligible_residential_3x_recorded_calendar_warranty_signal_within_30d_after_3_of_3]
      - name: prediction_time_definition
        data_tests:
          - accepted_values:
              arguments:
                values: [after_recorded_3_of_3_event]
      - name: calendar_pest_text_category
        data_tests:
          - accepted_values:
              arguments:
                values: [TERMITE, COCKROACH, BED_BUG, MOSQUITO, RODENT, ANT, FLY, UNSPECIFIED]
      - name: calendar_service_method_category
        data_tests:
          - accepted_values:
              arguments:
                values: [FOGGING_OR_MISTING, GEL_OR_BAIT, SPRAY, INSPECTION, UNSPECIFIED]
      - name: team_events_prior_7d
        data_tests: [not_null]
      - name: team_events_before_anchor_same_day
        data_tests: [not_null]
